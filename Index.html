<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1E3A8A,#38BDF8);
}

.container{
    width:360px;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.container h1{
    color:#1E3A8A;
    text-align:center;
    font-size:32px;
    margin-bottom:5px;
}

.container p{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus{
    border:1px solid #1E3A8A;
}

button{
    width:100%;
    margin-top:25px;
    padding:12px;
    background:#3B5BFF;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1E3A8A;
}

.bottom{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
}

.bottom a{
    text-decoration:none;
    color:#3B5BFF;
    font-size:14px;
}

.bottom a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="container">

<h1>Student Attendance<br>Management System</h1>

<p>Login to Continue</p>

<form>

<label>Username</label>
<input type="email" placeholder="abc@gmail.com">

<label>Password</label>
<input type="password" placeholder="******">

<button type="submit">Login</button>

<div class="bottom">
<a href="#">Forgot Password?</a>
<a href="#">Register</a>
</div>

</form>

</div>

</body>
</html>
